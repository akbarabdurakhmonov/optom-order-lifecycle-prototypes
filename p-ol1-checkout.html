<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-OL1 Cart and checkout: branch, method, price</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Optom.uz prototype base — colours and components taken from the Figma exports (Seller website, Buyer website, Super Admin Old) */
:root{
  --green:#00a028; --green-600:#008a22; --green-50:#e6f6ea; --green-100:#cdeed5;
  --ink:#1b1c1f; --ink-2:#38383b; --muted:#6b7079; --muted-2:#8b9189; --line:#e7e9ec; --line-2:#d9dce1;
  --bg:#f3f4f6; --card:#ffffff; --red:#d92d20; --red-50:#fdecec; --amber:#ca8504; --amber-50:#fef7c3;
  --blue:#0c75ed; --blue-50:#e8f2fe; --violet:#7a5af8; --violet-50:#f1edff;
  --radius:12px; --radius-sm:8px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green);text-decoration:none}
/* ---- prototype harness bar ---- */
.pbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:#14161a;color:#e9ecef;font-size:12.5px}
.pbar b{color:#fff;font-weight:600}
.pbar .tag{background:#2a2e35;border-radius:6px;padding:2px 8px;color:#c6cbd2}
.pbar select{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 8px;max-width:420px}
.pbar .sp{flex:1}
.pbar button{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 10px;cursor:pointer}
.pbar button.on{background:var(--green);border-color:var(--green)}
.notes{position:fixed;right:16px;bottom:16px;width:380px;max-height:60vh;overflow:auto;z-index:60;background:#fffef5;border:1px solid #eadf9f;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px 16px;font-size:12.5px;display:none}
.notes.show{display:block}
.notes h4{margin:0 0 6px;font-size:13px}
.notes ul{margin:4px 0 0 16px;padding:0}
.notes li{margin:3px 0}
.notes .src{color:#6b6200;font-size:11.5px;margin-top:8px}
/* ---- seller / admin shell ---- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 40px)}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:26px;letter-spacing:-.5px;margin:0 6px 22px;color:var(--ink)}
.logo svg{flex:none}
.side .grp{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);cursor:default}
.nav.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--ink);font-weight:500}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
.side .me{margin-top:auto;background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.ava{width:34px;height:34px;border-radius:50%;background:#d7dbe0;display:grid;place-items:center;font-weight:600;color:#555;flex:none}
.me small{display:block;color:var(--green);font-size:12px}
.main{padding:16px 24px 40px 8px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.crumbs{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.crumbs b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.lang{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px}
.h1{font-size:26px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
/* ---- components ---- */
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.sub{color:var(--muted);margin:0}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.sec>.lbl{font-weight:600}
.sec>.lbl .sub{font-weight:400;font-size:13px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.inp{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.inp.err{border-color:var(--red)}
.inp[disabled]{background:#f6f7f9;color:var(--muted)}
.err-t{color:var(--red);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-600)}
.btn.pri[disabled]{background:#9fd8ad;cursor:not-allowed}
.btn.out{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn.soft{background:var(--green-50);color:var(--green)}
.btn.dan{background:var(--red-50);color:var(--red)}
.btn.danfill{background:var(--red);color:#fff}
.btn.link{background:none;padding:6px 4px;color:var(--green)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:500;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--green-50);color:var(--green);border-color:var(--green-100)}
.pill.v{background:var(--violet-50);color:var(--violet);border-color:#ddd3ff}
.pill.a{background:#fff6e0;color:#b54708;border-color:#fde7b0}
.pill.r{background:var(--red-50);color:var(--red);border-color:#f9c9c4}
.pill.n{background:#f1f2f4;color:var(--ink-2);border-color:var(--line)}
.pill.b{background:var(--blue-50);color:var(--blue);border-color:#c9e0fd}
.alert{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid}
.alert .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.alert.w{background:var(--amber-50);border-color:var(--amber)} .alert.w .ic{background:var(--amber)}
.alert.e{background:var(--red-50);border-color:var(--red)} .alert.e .ic{background:var(--red)}
.alert.i{background:var(--blue-50);border-color:var(--blue)} .alert.i .ic{background:var(--blue)}
.alert.s{background:var(--green-50);border-color:var(--green)} .alert.s .ic{background:var(--green)}
.alert b{display:block;margin-bottom:2px}
.toggle{position:relative;width:40px;height:22px;border-radius:12px;background:#d0d4da;border:none;cursor:pointer;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:21px}
.toggle[disabled]{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--green);margin-top:2px;flex:none}
table.t{width:100%;border-collapse:collapse}
table.t th{background:#f6f7f9;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 12px}
table.t td{border-top:1px solid var(--line);padding:12px;vertical-align:middle}
.kv{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.kv:first-of-type{border-top:none}
.kv .k{color:var(--muted)}
.kv svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:rgba(16,18,22,.45);display:grid;place-items:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1c1f;color:#fff;border-radius:10px;padding:10px 16px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}
.digits{display:flex;gap:6px;align-items:flex-end}
.digit{background:#eceef1;border-radius:10px;width:42px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:600}
.dsep{font-size:24px;font-weight:600;padding:0 4px 12px}
.ycard{border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff}
.ycard.on{border-color:var(--green);background:var(--green-50)}
.ycard .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.ycard.on .r{border:5px solid var(--green)}
.ycard[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.yglogo{font-weight:700;letter-spacing:-.3px}
.yglogo i{font-style:italic;font-weight:800}
.code-big{font-size:30px;letter-spacing:6px;font-weight:700;background:#f6f7f9;border-radius:10px;padding:8px 14px;display:inline-block}
.steps{display:flex;justify-content:space-between;position:relative;margin:6px 0 4px}
.steps::before{content:"";position:absolute;left:20px;right:20px;top:17px;height:2px;background:var(--line)}
.step{position:relative;text-align:center;flex:1;color:var(--muted);font-size:13px}
.step .dot{width:36px;height:36px;border-radius:10px;margin:0 auto 6px;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center}
.step.on{color:var(--green);font-weight:500}
.step.on .dot{background:var(--green-50);border-color:var(--green)}
.timeline .it{display:flex;gap:12px;padding:8px 0}
.timeline .it .d{width:30px;height:30px;border-radius:50%;background:#f1f2f4;display:grid;place-items:center;flex:none;font-size:13px}
.timeline .it small{display:block;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
.spin{width:16px;height:16px;border:2px solid #c8ead1;border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ann{outline:2px dashed #f0b400;outline-offset:3px;border-radius:12px}

:root{--blue:#0c75ed;--ab:#eef5f7}
body{background:var(--ab)}
.ash{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 44px)}
.aside{background:#fff;padding:22px 16px}
.aside .logo{font-size:27px;margin:0 0 28px 12px}
.anav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-weight:500;color:#1b1c1f;cursor:default;margin-bottom:4px}
.anav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.anav.on{background:var(--blue);color:#fff}
.anav .ch{margin-left:auto;font-size:11px;opacity:.6}
.asub{padding:8px 14px 8px 48px;border-radius:8px;color:#4b5563;font-size:14px;margin-bottom:2px;cursor:pointer}
.asub.on{background:#e8f1fd;color:var(--blue);font-weight:500}
.atop{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:16px 28px;background:#fff}
.abox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;background:#fff}
.abox select{border:none;font:inherit;background:transparent;font-weight:500;outline:none}
.apanel{background:#fff;border-radius:14px;margin:24px 28px;padding:24px 26px}
.apanel h1{font-size:24px;margin:0 0 18px;font-weight:600;display:flex;align-items:center;gap:12px}
.apanel h1 .btn{font-size:14px}
.back{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#555;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--green)}
.tab .cnt{background:#fde8e7;color:var(--red);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px}
.flt{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.flt .s{display:flex;flex:1;min-width:260px;border:1px solid var(--green);border-radius:10px;overflow:hidden}
.flt .s input{flex:1;border:none;padding:9px 12px;outline:none;font:inherit}
.flt .s button{background:var(--green);color:#fff;border:none;padding:0 18px;font-weight:600;font:inherit}
.gsel{background:#f2f3f5;border:none;border-radius:10px;padding:9px 12px;font:inherit;min-width:190px}
.chip{display:inline-block;border-radius:5px;padding:2px 8px;font-size:12px;color:#fff;font-weight:500;white-space:nowrap}
.c-blue{background:#1d5fd1}.c-or{background:#f0a020}.c-pur{background:#7a29e0}.c-cy{background:#16a3d9}.c-gr{background:#1fa83c}.c-red{background:#d92d20}.c-gray{background:#5f6368}
.go{width:30px;height:30px;border-radius:50%;background:#e6f6ea;color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.gin{background:#f2f3f5;border-radius:10px;padding:10px 12px;color:#4b5563;min-height:40px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.att{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.att .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}
.att .bd{padding:14px 16px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.pr{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr small{display:block;color:var(--muted);font-size:12px}
.pr b{font-size:17px;font-weight:600}
.pr.hl{border-color:#f5c26b;background:#fffaf0}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:13.5px}
.dl div span{color:var(--muted)}
.log{background:#0f1720;color:#d6e2ee;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;white-space:pre-wrap}
.log .m{color:#7dd3fc}.log .ok{color:#86efac}.log .bad{color:#fca5a5}
.swrow{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.swrow .tx{flex:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.ro-note{font-size:12.5px;color:var(--muted);background:#f6f7f9;border-radius:8px;padding:6px 10px;display:inline-block}
.radio-l{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.radio-l.on{border-color:var(--green);background:var(--green-50)}
textarea.inp{min-height:76px;resize:vertical}

.og{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}
.prod{display:flex;align-items:center;gap:12px}
.thumb{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#e8d8d8,#c9b3b3)}
.price-line{background:#f6f7f9;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.price-line b{font-weight:600}
.preset{border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.preset.on{border-color:var(--green);background:var(--green-50)}
.preset .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.preset.on .r{border:5px solid var(--green)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.courier{display:flex;gap:14px;align-items:center;background:#f6f7f9;border-radius:12px;padding:12px 14px}
.cnt{font-variant-numeric:tabular-nums;font-weight:600}

.buyer{background:#fff;min-height:100vh}
.strip{background:#1b1c1f;color:#e9ecef;font-size:13px;display:flex;justify-content:space-between;padding:10px 7%}
.strip span+span{margin-left:28px}
.bh{display:flex;align-items:center;gap:18px;padding:14px 7%;border-bottom:1px solid var(--line)}
.bh .logo{margin:0;font-size:30px}
.srch{flex:1;display:flex;border:2px solid var(--green);border-radius:10px;overflow:hidden}
.srch input{flex:1;border:none;padding:9px 12px;outline:none}
.srch button{background:var(--green);color:#fff;border:none;padding:0 20px;font-weight:600}
.wrapb{padding:24px 7% 60px}
.cg{display:grid;grid-template-columns:1fr 330px;gap:40px;align-items:start}
.blk{margin-bottom:26px}
.blk h2{font-size:19px;margin:0 0 4px;font-weight:600}
.box{border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.opt{display:flex;gap:12px;align-items:center;padding:14px 0}
.opt+.opt{border-top:1px solid var(--line)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.radio.on{border:5px solid var(--green)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.tile{border:1px solid var(--line-2);border-radius:12px;padding:14px;height:84px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;background:#fff}
.tile.on{border-color:var(--green);background:var(--green-50)}
.tile .lg{font-size:17px}
.sumc{border-radius:16px;box-shadow:0 2px 12px rgba(16,24,40,.08);padding:20px 22px}
.sumc .ln{display:flex;justify-content:space-between;margin:7px 0;color:var(--muted)}
.sumc .ln b{color:var(--ink);font-weight:600}
.sumc .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:12px;font-size:18px;font-weight:600}
.big{width:100%;justify-content:center;padding:15px;font-size:16px;border-radius:12px;margin-top:16px}
.ygopts{display:grid;gap:8px;margin-top:12px}
.valid{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}
.demo{background:#fff3c4;border:1px dashed #d9b400;color:#6b5600;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.adr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.oc{display:grid;grid-template-columns:1fr 330px;gap:40px;align-items:start}
.track{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
/* ---- seller-delivery additions ---- */
.phonewrap{display:flex;justify-content:center;padding:24px 0 40px}
.phone{width:390px;min-height:780px;border:11px solid #15171a;border-radius:44px;background:#f3f4f6;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.phone .sb{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;background:#fff}
.phone .ah{background:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.phone .ah b{font-size:17px}
.phone .pc{padding:12px}
.phone .card{padding:14px 14px;border-radius:14px}
.phone .btn{padding:11px 14px}
.phone .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 14px;font-size:11px;color:var(--muted)}

// ---- harness ----
const H = { scen: [], cur: null, notesOn: false };
function harness(meta, scenarios) {
  H.scen = scenarios;
  const bar = document.createElement("div"); bar.className = "pbar";
  bar.innerHTML = `<b>${esc(meta.title)}</b><span class="tag">${esc(meta.stories)}</span><span class="tag">v${meta.version}</span>
    <span>Scenario:</span><select id="scen">${scenarios.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.label)}</option>`).join("")}</select>
    <button id="reset" title="Reset the current scenario">↺ Reset</button><span class="sp"></span>
    <span style="color:#9aa1ab">Prototype · RU UI · notes in English</span>
    <button id="ntoggle">Notes for this state</button>`;
  document.body.prepend(bar);
  const notes = document.createElement("div"); notes.className = "notes"; notes.id = "notes"; document.body.append(notes);
  $("#scen").onchange = e => go(+e.target.value);
  $("#reset").onclick = () => go(+$("#scen").value);
  $("#ntoggle").onclick = () => { H.notesOn = !H.notesOn; notes.classList.toggle("show", H.notesOn); $("#ntoggle").classList.toggle("on", H.notesOn); };
  const q = new URLSearchParams(location.hash.slice(1)), qs = new URLSearchParams(location.search); go(+(q.get("s") || qs.get("s") || 0));
}
function go(i) {
  const s = H.scen[i]; if (!s) return; H.cur = s; $("#scen").value = i; history.replaceState(null, "", "#s=" + i);
  s.apply(); setNotes(s.notes, s.src);
}
function setNotes(list, src) {
  $("#notes").innerHTML = `<h4>What this state shows</h4><ul>${(list || []).map(n => `<li>${n}</li>`).join("")}</ul>${src ? `<div class="src">${src}</div>` : ""}`;
}
let toastT;
function toast(t) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.append(el); } el.textContent = t; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 3200); }
function modal(html) { closeModal(); const bg = document.createElement("div"); bg.className = "modal-bg"; bg.id = "mbg"; bg.innerHTML = `<div class="modal">${html}</div>`; document.body.append(bg); return bg; }
function closeModal() { const m = $("#mbg"); if (m) m.remove(); }

// When embedded in a narrow frame (e.g. Confluence iFrame), scale the desktop layout down to fit
(function fitFrame() {
  if (window === window.top) return;

// P-OL1 Buyer: cart and checkout — branch per line, delivery method, price and payment window
const SELLERS = { to: "ТехноОпт", hs: "Холод Сервис" };
const BR = {
  ch: { s: "to", n: "Филиал Чиланзар", city: "Ташкент", a: "Ташкент, Чиланзарский р-н, ул. Бунёдкор, 12", pu: true, sd: { "Ташкент": 1 } },
  se: { s: "to", n: "Склад Сергели", city: "Ташкент", a: "Ташкент, Сергелийский р-н, ул. Янги Сергели, 45", pu: false, sd: { "Ташкент": 2 } },
  sm: { s: "to", n: "Филиал Самарканд", city: "Самарканд", a: "Самарканд, ул. Абдурахмана Джами, 40", pu: true, sd: { "Самарканд": 2 } },
  yu: { s: "hs", n: "Филиал Юнусабад", city: "Ташкент", a: "Ташкент, Юнусабадский р-н, ул. Амира Темура, 107", pu: true, sd: { "Ташкент": 1 } },
};
const ADDRS = { sam: { t: "Самарканд, ул. Регистан, 5", city: "Самарканд" }, tash: { t: "Ташкент, массив Буз-1, 8", city: "Ташкент" } };
// distances only drive the order and the «ближайший» hint; they are never shown as numbers
const DIST = { sam: { ch: 288, se: 281, sm: 4, yu: 296 }, tash: { ch: 3, se: 11, sm: 290, yu: 9 } };
const PROD = {
  fr: { n: "Холодильник Artel HD 455", p: 6300000, kg: 62 },
  fz: { n: "Морозильный ларь Artel 300", p: 4100000, kg: 48 },
  ac: { n: "Кондиционер Artel 12 Inverter", p: 3900000, kg: 35 },
  st: { n: "Стулья офисные (комплект)", p: 450000, kg: 24 },
};
const STOCK0 = { fr: { ch: 5, se: 8, sm: 4 }, fz: { ch: 2, se: 0, sm: 3 }, ac: { ch: 12, se: 15, sm: 3 }, st: { yu: 20 } };
const LINES0 = [{ id: "l1", p: "fr", q: 2, s: "to" }, { id: "l2", p: "fz", q: 1, s: "to" }, { id: "l3", p: "ac", q: 10, s: "to" }, { id: "l4", p: "st", q: 4, s: "hs" }];
const M = { pu: "Самовывоз", sd: "Доставка продавцом", yg: "Yandex Go", fa: "Fargo" };
const ORDER_NO = "68726512";
const ADDR_WHY = "Добавьте адрес доставки";
let S = {}, cdTimer = null;

function reset(o) {
  closeModal(); clearInterval(cdTimer);
  S = Object.assign({ view: "cart", hdr: "sam", saved: ["sam", "tash"], sel: ["l1", "l2"], stock: null, prev: "yg", fargoLogin: true, heavy: false, puOff: false,
    stale: false, bump: 0, priceMsg: false, method: undefined, addr: undefined, ck: null, alert: "", demo: "", sheet: null, heavySw: false }, o || {});
  S.stock = JSON.parse(JSON.stringify(STOCK0));
  (o && o.stockOv || []).forEach(([p, b, q]) => { S.stock[p][b] = q; });
  S.lines = LINES0.filter(l => !(o && o.drop || []).includes(l.id)).map(l => Object.assign({}, l, { manual: false }));
  S.lines.forEach(l => { l.br = suggest(l); });
  if (S.view === "checkout" || S.view === "phones") startCheckout(S.ckSel || S.sel, true);
  render();
}
const stock = (p, b) => (S.stock[p] || {})[b] || 0;
const branchesOf = s => Object.keys(BR).filter(k => BR[k].s === s);
const fullAt = l => branchesOf(l.s).filter(b => stock(l.p, b) >= l.q);
const byDist = arr => S.hdr ? arr.slice().sort((a, b) => DIST[S.hdr][a] - DIST[S.hdr][b]) : arr.slice();
// 4.3.1: nearest branch of the seller with the full quantity, from the header address; else a branch in the buyer's city; else the first active one
function suggest(l) {
  const ok = fullAt(l); if (!ok.length) return null;
  if (S.hdr) return byDist(ok)[0];
  if (S.city) { const c = ok.find(b => BR[b].city === S.city); if (c) return c; }
  return ok[0];
}
const lineById = id => S.lines.find(l => l.id === id);
const fmtD = n => { const d = new Date(2026, 9, 27 + n); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear(); };
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "товар" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "товара" : "товаров";

function header() {

  return `<div class="strip"><span>➤ <a href="#" id="hdraddr" style="color:#fff;text-decoration:underline">${t}</a></span><span><span>О компании</span><span>Связаться с нами</span><span>Доставка и оплата</span></span></div>

}

// ---------- cart ----------
function cartState(selIds) {
  const ls = (selIds || S.sel).map(lineById).filter(Boolean);
  const brs = [...new Set(ls.map(l => l.br))];
  if (!ls.length) return { st: "none", ls };
  if (brs.length === 1) return { st: "ok", ls, br: brs[0] };
  let move = null;
  const sellers = [...new Set(ls.map(l => l.s))];
  if (sellers.length === 1) {
    const cand = branchesOf(sellers[0]).filter(b => ls.every(l => stock(l.p, b) >= l.q));
    if (cand.length) move = byDist(cand)[0];
  }
  return { st: "mixed", ls, move };
}
function groups() {
  const out = [];
  Object.keys(SELLERS).forEach(s => {
    const ls = S.lines.filter(l => l.s === s); if (!ls.length) return;
    const brs = byDist(Object.keys(BR).filter(b => ls.some(l => l.br === b)));
    out.push({ s, brs: brs.map(b => ({ b, ls: ls.filter(l => l.br === b) })) });
  });
  return out;
}
const isNear = l => l.br && l.br === suggest(l) && !!S.hdr && branchesOf(l.s).length > 1;
function shipLine(l, mob) {
  return `<div class="ship">${mob ? "" : ICON.store}<span style="white-space:nowrap">Отправка из: <b>${l.br ? BR[l.br].n : "—"}</b></span>${isNear(l) ? '<span class="near">ближайший</span>' : ""}<span class="chg" data-chg="${l.id}">Изменить</span></div>`;
}
function cartLine(l) {
  const p = PROD[l.p];
  return `<div class="cline"><input type="checkbox" data-sel="${l.id}" ${S.sel.includes(l.id) ? "checked" : ""}><span class="pimg"></span>
    <div><div class="pn">${p.n}</div><div class="small muted">${som(p.p)} / шт.</div>${shipLine(l)}</div>
    <div><span class="qty"><span>−</span><b>${l.q} шт.</b><span>+</span></span></div><div class="ltot">${som(p.p * l.q)}</div></div>`;
}
function cartSummary(cs) {
  const n = cs.ls.reduce((a, l) => a + l.q, 0), sum = cs.ls.reduce((a, l) => a + PROD[l.p].p * l.q, 0);

  if (cs.st === "mixed") {

    if (cs.move) msg += `<div class="alert i mt12"><span class="ic">i</span><div>Все товары есть в филиале «${BR[cs.move].n}». Отправить всё оттуда?<div class="mt8"><button class="btn soft sm" id="move" data-to="${cs.move}">Перенести</button></div></div></div>`;
  }
  return `<div class="sumc"><h3 style="margin:0 0 8px">Ваша корзина</h3><div class="ln">Выбрано<b>${n} шт.</b></div><div class="ln">Товары<b>${som(sum)}</b></div>
    ${cs.st === "ok" ? `<div class="ln">Отправка из<b>${BR[cs.br].n}</b></div>` : ""}
    <div class="tot"><span>Итого</span><span>${som(sum)}</span></div>${msg}
    <button class="btn pri big" id="toCheckout" ${cs.st === "ok" ? "" : "disabled"}>Оформить заказ</button>
    ${cs.st === "none" ? '<p class="small muted mt8">Отметьте товары, которые хотите оформить.</p>' : ""}<p class="hint mt8">Стоимость доставки рассчитывается при оформлении.</p></div>`;
}
function cart() {
  const cs = cartState();
  const gs = groups().map(g => `<div class="cartg"><div class="sh">${ICON.store}${SELLERS[g.s]}</div>
      ${g.brs.map(x => `<div class="bh2">${ICON.pin}${BR[x.b].n} · ${BR[x.b].city}</div>${x.ls.map(cartLine).join("")}`).join("")}</div>`).join("");
  const top = (S.alert ? `<div class="alert e" style="margin-bottom:16px"><span class="ic">!</span><div>${S.alert}</div></div>` : "") + (S.demo ? `<div class="demo-line" style="margin:0 0 16px">${S.demo}</div>` : "");
  return `<div class="buyer">${header()}<div class="wrapb"><div class="small muted">Главная › Корзина</div><h1 style="font-size:30px;margin:8px 0 18px">Корзина <span class="muted small">${S.lines.length} ${plural(S.lines.length)}</span></h1>

function pickerRows(l) {

// ---------- checkout ----------
function startCheckout(ids, init) {
  const cs = cartState(ids);
  S.ck = { ids: cs.ls.map(l => l.id), br: cs.br || (cs.ls[0] && cs.ls[0].br) };
  if (S.addr === undefined || !init) S.addr = S.hdr && S.saved.includes(S.hdr) ? S.hdr : (S.saved[0] || null);
  S.method = defMethod();
}
function methods() {
  const b = BR[S.ck.br], a = S.addr ? ADDRS[S.addr] : null;
  const tt = a && a.city === "Ташкент" && b.city === "Ташкент";
  const puOk = b.pu && !S.puOff;
  const sdDays = a && b.sd[a.city];
  const fPrice = (tt ? 30000 : a && a.city === b.city ? 45000 : 60000) + S.bump;
  return [
    { k: "pu", ok: puOk, why: "В этом филиале нет самовывоза", price: 0, pt: "0 сум", sub: `${b.n} · ${b.a}` },
    { k: "sd", ok: !!sdDays, why: a ? "Продавец не доставляет по этому адресу" : ADDR_WHY, price: 0, pt: "Бесплатно", sub: sdDays ? `Ожидается до ${fmtD(sdDays)}` : "" },
    { k: "yg", ok: !!tt, why: a ? "Yandex Go доставляет только по Ташкенту" : ADDR_WHY, price: 35000, pt: som(35000), sub: `Ожидается ${fmtD(0)} – ${fmtD(1)}` },
    { k: "fa", ok: !!a && S.fargoLogin && !S.heavy, why: !a ? ADDR_WHY : !S.fargoLogin ? "Продавец не отправляет через Fargo" : "Слишком тяжёлый заказ для Fargo (более 1 000 кг)",
      price: fPrice, pt: som(fPrice), old: S.bump && S.priceMsg ? som(fPrice - S.bump) : "", sub: tt ? `Ожидается ${fmtD(1)} – ${fmtD(3)}` : `Ожидается ${fmtD(3)} – ${fmtD(5)}` },
  ];
}
// 4.3.2 default: previous method if available; else the cheapest available delivery to the address; pickup only as the previous method
function defMethod() {
  const ms = methods(), ok = ms.filter(m => m.ok);
  const prev = ok.find(m => m.k === S.prev); if (prev) return prev.k;
  // pickup also when it is the only method the seller offers for this order at all (no delivery offered, not merely greyed)
  if (BR[S.ck.br].noDelivery && ok.some(m => m.k === "pu")) return "pu";
  if (!S.addr) return null;
  const dl = ok.filter(m => m.k !== "pu");
  return dl.length ? dl.slice().sort((x, y) => x.price - y.price)[0].k : null;
}
const mIcon = k => k === "pu" ? ICON.store : ICON.truck;
const mName = k => k === "yg" ? YG : k === "fa" ? FARGO : `<b>${M[k]}</b>`;
function mTile(m, compact) {
  const on = S.method === m.k && m.ok;
  return `<div class="mtile ${m.ok ? "" : "off"} ${on ? "on" : ""}" ${m.ok ? `data-m="${m.k}"` : 'aria-disabled="true"'}><span class="r"></span>
    ${mIcon(m.k).replace("<svg", '<svg class="mic"')}<div style="flex:1;min-width:0">${mName(m.k)}
    ${m.ok ? `<div class="small muted">${compact && m.k === "pu" ? BR[S.ck.br].n : m.sub}</div>` : `<div class="why">${m.why}</div>`}</div>${m.ok ? `<div class="mp">${m.old ? `<s>${m.old}</s>` : ""}${m.pt}</div>` : ""}</div>`;
}
function ckTotals() {
  const ls = S.ck.ids.map(lineById), goods = ls.reduce((a, l) => a + PROD[l.p].p * l.q, 0);
  const m = methods().find(x => x.k === S.method && x.ok);
  return { ls, goods, m, deliv: m ? m.price : 0, total: goods + (m ? m.price : 0), kg: S.heavySw ? 1240 : ls.reduce((a, l) => a + PROD[l.p].kg * l.q, 0) };
}
function checkout() {

      ${t.ls.map(l => `<div class="row mt8"><span class="thumb"></span><div style="flex:1">${PROD[l.p].n}<div class="small muted">${l.q} шт. × ${som(PROD[l.p].p)}</div></div><b>${som(PROD[l.p].p * l.q)}</b></div>`).join("")}</div>
