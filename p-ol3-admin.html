<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-OL3 Admin: orders, problems and actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Optom.uz prototype base — colours and components taken from the Figma exports (Seller website, Buyer website, Super Admin Old) */
:root{
  --green:#00a028; --green-600:#008a22; --green-50:#e6f6ea; --green-100:#cdeed5;
  --ink:#1b1c1f; --ink-2:#38383b; --muted:#6b7079; --muted-2:#8b9189; --line:#e7e9ec; --line-2:#d9dce1;
  --bg:#f3f4f6; --card:#ffffff; --red:#d92d20; --red-50:#fdecec; --amber:#ca8504; --amber-50:#fef7c3;
  --blue:#0c75ed; --blue-50:#e8f2fe; --violet:#7a5af8; --violet-50:#f1edff;
  --radius:12px; --radius-sm:8px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green);text-decoration:none}
/* ---- prototype harness bar ---- */
.pbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:#14161a;color:#e9ecef;font-size:12.5px}
.pbar b{color:#fff;font-weight:600}
.pbar .tag{background:#2a2e35;border-radius:6px;padding:2px 8px;color:#c6cbd2}
.pbar select{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 8px;max-width:420px}
.pbar .sp{flex:1}
.pbar button{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 10px;cursor:pointer}
.pbar button.on{background:var(--green);border-color:var(--green)}
.notes{position:fixed;right:16px;bottom:16px;width:380px;max-height:60vh;overflow:auto;z-index:60;background:#fffef5;border:1px solid #eadf9f;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px 16px;font-size:12.5px;display:none}
.notes.show{display:block}
.notes h4{margin:0 0 6px;font-size:13px}
.notes ul{margin:4px 0 0 16px;padding:0}
.notes li{margin:3px 0}
.notes .src{color:#6b6200;font-size:11.5px;margin-top:8px}
/* ---- seller / admin shell ---- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 40px)}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:26px;letter-spacing:-.5px;margin:0 6px 22px;color:var(--ink)}
.logo svg{flex:none}
.side .grp{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);cursor:default}
.nav.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--ink);font-weight:500}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
.side .me{margin-top:auto;background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.ava{width:34px;height:34px;border-radius:50%;background:#d7dbe0;display:grid;place-items:center;font-weight:600;color:#555;flex:none}
.me small{display:block;color:var(--green);font-size:12px}
.main{padding:16px 24px 40px 8px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.crumbs{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.crumbs b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.lang{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px}
.h1{font-size:26px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
/* ---- components ---- */
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.sub{color:var(--muted);margin:0}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.sec>.lbl{font-weight:600}
.sec>.lbl .sub{font-weight:400;font-size:13px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.inp{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.inp.err{border-color:var(--red)}
.inp[disabled]{background:#f6f7f9;color:var(--muted)}
.err-t{color:var(--red);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-600)}
.btn.pri[disabled]{background:#9fd8ad;cursor:not-allowed}
.btn.out{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn.soft{background:var(--green-50);color:var(--green)}
.btn.dan{background:var(--red-50);color:var(--red)}
.btn.danfill{background:var(--red);color:#fff}
.btn.link{background:none;padding:6px 4px;color:var(--green)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:500;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--green-50);color:var(--green);border-color:var(--green-100)}
.pill.v{background:var(--violet-50);color:var(--violet);border-color:#ddd3ff}
.pill.a{background:#fff6e0;color:#b54708;border-color:#fde7b0}
.pill.r{background:var(--red-50);color:var(--red);border-color:#f9c9c4}
.pill.n{background:#f1f2f4;color:var(--ink-2);border-color:var(--line)}
.pill.b{background:var(--blue-50);color:var(--blue);border-color:#c9e0fd}
.alert{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid}
.alert .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.alert.w{background:var(--amber-50);border-color:var(--amber)} .alert.w .ic{background:var(--amber)}
.alert.e{background:var(--red-50);border-color:var(--red)} .alert.e .ic{background:var(--red)}
.alert.i{background:var(--blue-50);border-color:var(--blue)} .alert.i .ic{background:var(--blue)}
.alert.s{background:var(--green-50);border-color:var(--green)} .alert.s .ic{background:var(--green)}
.alert b{display:block;margin-bottom:2px}
.toggle{position:relative;width:40px;height:22px;border-radius:12px;background:#d0d4da;border:none;cursor:pointer;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:21px}
.toggle[disabled]{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--green);margin-top:2px;flex:none}
table.t{width:100%;border-collapse:collapse}
table.t th{background:#f6f7f9;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 12px}
table.t td{border-top:1px solid var(--line);padding:12px;vertical-align:middle}
.kv{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.kv:first-of-type{border-top:none}
.kv .k{color:var(--muted)}
.kv svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:rgba(16,18,22,.45);display:grid;place-items:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1c1f;color:#fff;border-radius:10px;padding:10px 16px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}
.digits{display:flex;gap:6px;align-items:flex-end}
.digit{background:#eceef1;border-radius:10px;width:42px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:600}
.dsep{font-size:24px;font-weight:600;padding:0 4px 12px}
.ycard{border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff}
.ycard.on{border-color:var(--green);background:var(--green-50)}
.ycard .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.ycard.on .r{border:5px solid var(--green)}
.ycard[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.yglogo{font-weight:700;letter-spacing:-.3px}
.yglogo i{font-style:italic;font-weight:800}
.code-big{font-size:30px;letter-spacing:6px;font-weight:700;background:#f6f7f9;border-radius:10px;padding:8px 14px;display:inline-block}
.steps{display:flex;justify-content:space-between;position:relative;margin:6px 0 4px}
.steps::before{content:"";position:absolute;left:20px;right:20px;top:17px;height:2px;background:var(--line)}
.step{position:relative;text-align:center;flex:1;color:var(--muted);font-size:13px}
.step .dot{width:36px;height:36px;border-radius:10px;margin:0 auto 6px;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center}
.step.on{color:var(--green);font-weight:500}
.step.on .dot{background:var(--green-50);border-color:var(--green)}
.timeline .it{display:flex;gap:12px;padding:8px 0}
.timeline .it .d{width:30px;height:30px;border-radius:50%;background:#f1f2f4;display:grid;place-items:center;flex:none;font-size:13px}
.timeline .it small{display:block;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
.spin{width:16px;height:16px;border:2px solid #c8ead1;border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ann{outline:2px dashed #f0b400;outline-offset:3px;border-radius:12px}

:root{--blue:#0c75ed;--ab:#eef5f7}
body{background:var(--ab)}
.ash{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 44px)}
.aside{background:#fff;padding:22px 16px}
.aside .logo{font-size:27px;margin:0 0 28px 12px}
.anav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-weight:500;color:#1b1c1f;cursor:default;margin-bottom:4px}
.anav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.anav.on{background:var(--blue);color:#fff}
.anav .ch{margin-left:auto;font-size:11px;opacity:.6}
.asub{padding:8px 14px 8px 48px;border-radius:8px;color:#4b5563;font-size:14px;margin-bottom:2px;cursor:pointer}
.asub.on{background:#e8f1fd;color:var(--blue);font-weight:500}
.atop{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:16px 28px;background:#fff}
.abox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;background:#fff}
.abox select{border:none;font:inherit;background:transparent;font-weight:500;outline:none}
.apanel{background:#fff;border-radius:14px;margin:24px 28px;padding:24px 26px}
.apanel h1{font-size:24px;margin:0 0 18px;font-weight:600;display:flex;align-items:center;gap:12px}
.apanel h1 .btn{font-size:14px}
.back{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#555;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--green)}
.tab .cnt{background:#fde8e7;color:var(--red);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px}
.flt{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.flt .s{display:flex;flex:1;min-width:260px;border:1px solid var(--green);border-radius:10px;overflow:hidden}
.flt .s input{flex:1;border:none;padding:9px 12px;outline:none;font:inherit}
.flt .s button{background:var(--green);color:#fff;border:none;padding:0 18px;font-weight:600;font:inherit}
.gsel{background:#f2f3f5;border:none;border-radius:10px;padding:9px 12px;font:inherit;min-width:190px}
.chip{display:inline-block;border-radius:5px;padding:2px 8px;font-size:12px;color:#fff;font-weight:500;white-space:nowrap}
.c-blue{background:#1d5fd1}.c-or{background:#f0a020}.c-pur{background:#7a29e0}.c-cy{background:#16a3d9}.c-gr{background:#1fa83c}.c-red{background:#d92d20}.c-gray{background:#5f6368}
.go{width:30px;height:30px;border-radius:50%;background:#e6f6ea;color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.gin{background:#f2f3f5;border-radius:10px;padding:10px 12px;color:#4b5563;min-height:40px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.att{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.att .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}
.att .bd{padding:14px 16px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.pr{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr small{display:block;color:var(--muted);font-size:12px}
.pr b{font-size:17px;font-weight:600}
.pr.hl{border-color:#f5c26b;background:#fffaf0}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:13.5px}
.dl div span{color:var(--muted)}
.log{background:#0f1720;color:#d6e2ee;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;white-space:pre-wrap}
.log .m{color:#7dd3fc}.log .ok{color:#86efac}.log .bad{color:#fca5a5}
.swrow{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.swrow .tx{flex:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.ro-note{font-size:12.5px;color:var(--muted);background:#f6f7f9;border-radius:8px;padding:6px 10px;display:inline-block}
.radio-l{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.radio-l.on{border-color:var(--green);background:var(--green-50)}
textarea.inp{min-height:76px;resize:vertical}

.og{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}
.prod{display:flex;align-items:center;gap:12px}
.thumb{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#e8d8d8,#c9b3b3)}
.price-line{background:#f6f7f9;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.price-line b{font-weight:600}
.preset{border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.preset.on{border-color:var(--green);background:var(--green-50)}
.preset .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.preset.on .r{border:5px solid var(--green)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.courier{display:flex;gap:14px;align-items:center;background:#f6f7f9;border-radius:12px;padding:12px 14px}
.cnt{font-variant-numeric:tabular-nums;font-weight:600}

.buyer{background:#fff;min-height:100vh}
.strip{background:#1b1c1f;color:#e9ecef;font-size:13px;display:flex;justify-content:space-between;padding:10px 7%}
.strip span+span{margin-left:28px}
.bh{display:flex;align-items:center;gap:18px;padding:14px 7%;border-bottom:1px solid var(--line)}
.bh .logo{margin:0;font-size:30px}
.srch{flex:1;display:flex;border:2px solid var(--green);border-radius:10px;overflow:hidden}
.srch input{flex:1;border:none;padding:9px 12px;outline:none}
.srch button{background:var(--green);color:#fff;border:none;padding:0 20px;font-weight:600}
.wrapb{padding:24px 7% 60px}
.cg{display:grid;grid-template-columns:1fr 330px;gap:40px;align-items:start}
.blk{margin-bottom:26px}
.blk h2{font-size:19px;margin:0 0 4px;font-weight:600}
.box{border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.opt{display:flex;gap:12px;align-items:center;padding:14px 0}
.opt+.opt{border-top:1px solid var(--line)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.radio.on{border:5px solid var(--green)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.tile{border:1px solid var(--line-2);border-radius:12px;padding:14px;height:84px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;background:#fff}
.tile.on{border-color:var(--green);background:var(--green-50)}
.tile .lg{font-size:17px}
.sumc{border-radius:16px;box-shadow:0 2px 12px rgba(16,24,40,.08);padding:20px 22px}
.sumc .ln{display:flex;justify-content:space-between;margin:7px 0;color:var(--muted)}
.sumc .ln b{color:var(--ink);font-weight:600}
.sumc .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:12px;font-size:18px;font-weight:600}
.big{width:100%;justify-content:center;padding:15px;font-size:16px;border-radius:12px;margin-top:16px}
.ygopts{display:grid;gap:8px;margin-top:12px}
.valid{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:10px}
.demo{background:#fff3c4;border:1px dashed #d9b400;color:#6b5600;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.adr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.oc{display:grid;grid-template-columns:1fr 330px;gap:40px;align-items:start}
.track{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
/* ---- seller-delivery additions ---- */
.phonewrap{display:flex;justify-content:center;padding:24px 0 40px}
.phone{width:390px;min-height:780px;border:11px solid #15171a;border-radius:44px;background:#f3f4f6;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.phone .sb{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;background:#fff}
.phone .ah{background:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.phone .ah b{font-size:17px}
.phone .pc{padding:12px}
.phone .card{padding:14px 14px;border-radius:14px}
.phone .btn{padding:11px 14px}
.phone .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 14px;font-size:11px;color:var(--muted)}

const H = { scen: [], cur: null, notesOn: false };
function harness(meta, scenarios) {
  H.scen = scenarios;
  const bar = document.createElement("div"); bar.className = "pbar";
  bar.innerHTML = `<b>${esc(meta.title)}</b><span class="tag">${esc(meta.stories)}</span><span class="tag">v${meta.version}</span>
    <span>Scenario:</span><select id="scen">${scenarios.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.label)}</option>`).join("")}</select>
    <button id="reset" title="Reset the current scenario">↺ Reset</button><span class="sp"></span>
    <span style="color:#9aa1ab">Prototype · RU UI · notes in English</span>
    <button id="ntoggle">Notes for this state</button>`;
  document.body.prepend(bar);
  const notes = document.createElement("div"); notes.className = "notes"; notes.id = "notes"; document.body.append(notes);
  $("#scen").onchange = e => go(+e.target.value);
  $("#reset").onclick = () => go(+$("#scen").value);
  $("#ntoggle").onclick = () => { H.notesOn = !H.notesOn; notes.classList.toggle("show", H.notesOn); $("#ntoggle").classList.toggle("on", H.notesOn); };
  const q = new URLSearchParams(location.hash.slice(1)), qs = new URLSearchParams(location.search); go(+(q.get("s") || qs.get("s") || 0));
}
function go(i) {
  const s = H.scen[i]; if (!s) return; H.cur = s; $("#scen").value = i; history.replaceState(null, "", "#s=" + i);
  s.apply(); setNotes(s.notes, s.src);
}
function setNotes(list, src) {
  $("#notes").innerHTML = `<h4>What this state shows</h4><ul>${(list || []).map(n => `<li>${n}</li>`).join("")}</ul>${src ? `<div class="src">${src}</div>` : ""}`;
}

      <td class="small">${o.st === 35 ? "Доставлен " + o.dlv.slice(0, 10) : FINAL.includes(o.st) ? "—" : o.exp}</td><td>${o.prob ? `<span class="pmark" title="${esc(probText(o))}">Проблема</span>` : ""}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty3">По выбранным фильтрам заказов нет. <button class="btn link sm" id="fclr">Сбросить фильтры</button></div>`;
  return shell("list", `<div class="apanel"><h1>Заказы</h1>
    <div class="fbar"><div class="msel"><button class="bt ${F.st.length ? "on" : ""}" id="stbtn">${stLbl} ▾</button>${pan}</div>
      <select class="inp" id="fm"><option value="">Способ доставки: все</option>${MORD.map(k => `<option value="${k}" ${F.m === k ? "selected" : ""}>${MTH[k]}</option>`).join("")}</select>
      <select class="inp" id="fb"><option value="">Филиал: все</option>${Object.keys(BRN).map(k => `<option value="${k}" ${F.br === k ? "selected" : ""}>${BRN[k][0]} · ${SEL[BRN[k][1]][0]}</option>`).join("")}</select>
      <label class="chk" style="margin:0"><input type="checkbox" id="fp" ${F.pr ? "checked" : ""}>Есть проблема</label>
      <span class="hint">Найдено: ${rows.length}</span>${F.st.length || F.m || F.br || F.pr ? '<button class="btn link sm" id="fclr2">Сбросить фильтры</button>' : ""}</div>

}

// ---------- order page (OL-A1, OL-A3, OL-A5) ----------
function orderView() {
  const o = ord(S.cur), sl = SEL[BRN[o.br][1]];
  const vbar = `<div class="dem">${S.variants ? `<b>демо: заказ</b>${S.variants.map(v => `<button data-var="${v[0]}" class="${S.cur === v[0] ? "on" : ""}">${v[1]}</button>`).join("")}` : "<b>демо:</b>"}
      ${o.m === "fg" && o.st === 25 ? `<label style="margin-left:8px"><input type="checkbox" id="fgref" ${S.fgRefuse ? "checked" : ""}>Fargo отказал в отмене</label>` : ""}${staleDemo()}</div>`;
  const kv = [["Дата оплаты", o.d], ["Способ доставки", MTH[o.m] + (o.fid ? `<div class="mut">FargoOrderId: <span class="mono">${o.fid}</span></div>` : "")], ["Филиал", BRN[o.br][0]],
    ["Покупатель", o.b], ["Продавец", sl[0]], ["Ожидается", FINAL.includes(o.st) ? "—" : o.exp],
    ["Сумма", som(o.sum)], ["Покупатель видит", `«${buyerSees(o)}»`], ["Продавец видит", `«${sellerSees(o)}»`]];
  if (o.dlv && [35, 40].includes(o.st)) kv.push(["Доставлен (DeliveredAt)", o.dlv]);
  if (o.st === 35) kv.push(["Автозавершение", o.prob ? `<span class="pill a">приостановлено</span>` : `${o.due} (CompletionDueAt)`]);
  if (o.st === 40) kv.push(["Завершён", `${o.comp} · CompletedBy: ${o.compBy}`]);
  const canc = FINAL.includes(o.st) && o.st !== 40 ? `<div class="alert e"><span class="ic">!</span><div><b>${stFull(o.st)}</b>
      Кто отменил (CancelledBy): <b style="display:inline">${o.cb}</b>${o.cbw ? " · " + o.cbw : ""} · Причина (CancelReason): <span class="mono">${o.cr}</span> · ${o.cat}<br>Комментарий: ${o.cc ? esc(o.cc) : "<span class='mut'>нет</span>"}</div></div>` : "";
  const pb = o.prob ? `<div class="alert w"><span class="ic">!</span><div style="flex:1"><b>В списке «Проблемы с доставкой» с ${o.prob.since} (${ago(o.prob.since)}): ${esc(probText(o))}</b>${esc(o.prob.det || "")}
      <div class="ra">${abtn("resolve", o.n, true)}<button class="btn link sm" data-nav="prob">Открыть список проблем</button></div></div></div>` : "";
  const cl = !o.prob && o.closed && o.closed.st === o.st ? `<div class="alert i"><span class="ic">i</span><div><b>Строка «${esc(o.closed.p)}» закрыта ${o.closed.at} (${o.closed.by}, «Решено»)</b>Статус не изменился: покупатель по-прежнему видит «Проблема с доставкой», продавец — во вкладке «Проблемные». Строка вернётся в список при новом событии проблемы или если статус не изменится до ${o.closed.until}.</div></div>` : "";
  const acts = ordActs(o), why = cancelWhy(o);
  const abar = `<div class="abar"><span class="lbl">Действия:</span>${acts.map(k => abtn(k, o.n)).join("")}${why ? `<span class="why3">${why}</span>` : ""}<span class="sp"></span>
      <button class="btn out" data-act="msg" data-n="${o.n}">${ICON.chat.replace("<svg", '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"')}Написать продавцу</button></div>`;
  // history and events
  const hRows = o.h.map(r => { const w = whoTxt(o, r[3]); return { t: r[0], k: "h", r, w }; });
  const eRows = o.ev.map(r => ({ t: r[0], k: "e", r }));
  const evLine = r => `<span class="mono">${r[1]}</span>`;
  const evText = r => `${EVT[o.m][r[1]] || r[1]}${r[3] ? `<div class="mut">FargoOrderId ${r[3]}</div>` : ""}`;
  const evMap = r => r[2] ? `→ ${stName(r[2])}` : '<span class="mut">статус не изменён</span>';
  const hTr = x => `<tr><td class="small">${x.r[0]}</td><td>${x.r[1] == null ? "—" : stName(x.r[1])} → <b>${stName(x.r[2])}</b></td><td>${esc(x.w[0])}<div class="mut">${x.w[1]}</div></td><td><span class="src ${x.r[4]}">${SRC[x.r[4]]}</span></td><td class="small">${x.r[5] ? esc(x.r[5]) : '<span class="mut">—</span>'}</td></tr>`;
  let logs;
  if (S.merged) {
    const all = hRows.concat(eRows).sort((a, b) => pt(a.t) - pt(b.t) || (a.k === "e" ? -1 : 1));
    logs = `<table class="t3"><thead><tr><th>Время</th><th>Запись</th><th>Что произошло</th><th>Кто / перевозчик</th><th>Комментарий / статус</th></tr></thead><tbody>${all.map(x => x.k === "h"
      ? `<tr><td class="small">${x.t}</td><td><span class="src ${x.r[4]}">Статус · ${SRC[x.r[4]]}</span></td><td>${x.r[1] == null ? "—" : stName(x.r[1])} → <b>${stName(x.r[2])}</b></td><td>${esc(x.w[0])}<div class="mut">${x.w[1]}</div></td><td class="small">${x.r[5] ? esc(x.r[5]) : "—"}</td></tr>`
      : `<tr><td class="small">${x.t}</td><td><span class="src C">Событие</span></td><td>${evText(x.r)}</td><td>${carrierName(o)}<div>${evLine(x.r)}</div></td><td class="small">${evMap(x.r)}</td></tr>`).join("")}</tbody></table>`;
  } else {
    logs = `<div class="sec3"><h3>История статусов</h3><table class="t3"><thead><tr><th>Время</th><th>Статус: было → стало</th><th>Кто</th><th>Источник</th><th>Комментарий</th></tr></thead><tbody>${hRows.map(hTr).join("")}</tbody></table></div>
      <div class="sec3"><h3>События перевозчика</h3>${eRows.length ? `<table class="t3"><thead><tr><th>Время</th><th>Перевозчик</th><th>Код перевозчика</th><th>Что произошло</th><th>Статус заказа</th></tr></thead><tbody>${eRows.map(x => `<tr><td class="small">${x.r[0]}</td><td>${carrierName(o)}</td><td>${evLine(x.r)}</td><td>${evText(x.r)}</td><td class="small">${evMap(x.r)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="hint">${isCarrier(o) ? "Событий от перевозчика пока нет." : `${MTH[o.m]}: перевозчика нет, все шаги продавца — в истории статусов.`}</p>`}</div>`;
  }
  const mine = LOG.filter(l => l.n === o.n);
  const adm = `<div class="sec3"><h3>Действия администраторов по заказу</h3>${mine.length ? `<table class="t3"><thead><tr><th>Время</th><th>Администратор</th><th>Действие</th><th>Статус</th><th>Комментарий</th></tr></thead><tbody>${mine.map(l => `<tr><td class="small">${l.t}</td><td>${l.a}</td><td>${l.act}</td><td class="small">${logSt(l)}</td><td class="small">${l.c ? esc(l.c) : "—"}</td></tr>`).join("")}</tbody></table>` : '<p class="hint">Пока нет.</p>'}</div>`;
  const items = `<div class="sec3"><h3>Товары</h3><table class="t3"><tbody>${o.it.map(i => `<tr><td>${i[0]}</td><td style="width:120px">${i[1]} шт.</td></tr>`).join("")}</tbody></table>${FINAL.includes(o.st) && o.st !== 40 ? '<p class="hint">Количества сохранены как в заказе; остаток возвращён на склад филиала.</p>' : ""}</div>`;
  return shell("list", `<div class="apanel"><span class="back3" data-nav="list">‹ Заказы</span><h1>Заказ №${o.n} ${stHead(o.st)}</h1>${vbar}
    <div class="dl3">${kv.map(x => `<div><span>${x[0]}</span>${x[1]}</div>`).join("")}</div>${canc}${pb}${cl}${abar}
    <div class="sec3"><div class="row"><h3 style="margin:0">Журнал заказа</h3><span class="seg"><span data-mg="0" class="${S.merged ? "" : "on"}">Раздельно</span><span data-mg="1" class="${S.merged ? "on" : ""}">Вместе по времени</span></span></div></div>
    ${S.merged ? `<div style="margin-top:10px">${logs}</div>` : logs}${adm}${items}</div>`);
}

// ---------- problem list (OL-A2) ----------
function probView() {
  const P = S.pf;
  const rows = S.o.filter(o => o.prob && (!P.m || o.m === P.m) && (!P.t.length || P.t.includes(o.prob.t))).sort((a, b) => pt(a.prob.since) - pt(b.prob.since));
  const dem = `<div class="dem"><b>демо:</b>${S.demoRefuse != null ? `<label><input type="checkbox" id="dnc" ${S.demoNoCancel ? "checked" : ""}>Fargo не отменил прежнюю доставку</label>
      <label><input type="checkbox" id="drf" ${S.demoRefuse ? "checked" : ""}>Fargo снова отказал</label>` : ""}${staleDemo()}</div>`;
  const table = rows.length ? `<table class="t3"><thead><tr><th style="width:150px">Заказ</th><th>Способ</th><th>Проблема</th><th style="width:120px">С какого времени</th><th>Продавец</th><th style="width:250px">Действия</th></tr></thead><tbody>
    ${rows.map(o => `<tr class="${S.focus === o.n ? "hl" : ""}"><td><b>№${o.n}</b>${stCell(o.st)}</td><td>${MTH[o.m]}</td><td><b style="font-weight:600">${esc(probText(o))}</b><div class="mut">${esc(o.prob.det || "")}</div>${o.retryOk ? '<span class="pill g" style="margin-top:4px">Новая попытка разрешена</span>' : ""}</td>
      <td class="small">${o.prob.since}<div class="mut">${ago(o.prob.since)}</div></td><td>${SEL[BRN[o.br][1]][0]}<div class="mut">${BRN[o.br][0]}</div></td>
      <td><div class="ra">${probActs(o).map(k => abtn(k, o.n, true)).join("")}<button class="btn link sm" data-open="${o.n}">Открыть заказ</button></div>${o.m === "yg" && ["exc", "ygnb", "notacc"].includes(o.prob.t) ? '<div class="mut" style="margin-top:4px">Перезаказать Yandex Go может только продавец</div>' : ""}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty3">${P.m || P.t.length ? "По выбранным фильтрам проблем нет." : "Сейчас нет заказов с проблемами доставки."}${P.m || P.t.length ? ' <button class="btn link sm" id="pclr">Сбросить фильтры</button>' : ""}</div>`;
  return shell("prob", `<div class="apanel"><h1>Проблемы с доставкой <span class="pill r">${S.o.filter(o => o.prob).length}</span></h1>
    <div class="fbar"><select class="inp" id="pm"><option value="">Способ доставки: все</option>${MORD.map(k => `<option value="${k}" ${P.m === k ? "selected" : ""}>${MTH[k]}</option>`).join("")}</select><span class="hint">сначала самые старые · найдено: ${rows.length}</span></div>
    <div class="chips" style="margin-bottom:14px"><span class="hint">Тип проблемы:</span>${PT_ORDER.map(t => `<span class="chipt ${P.t.includes(t) ? "on" : ""}" data-pt="${t}">${PT[t]}</span>`).join("")}</div>
    ${dem}${table}</div>`);
}

// ---------- admin action log (OL-A4) ----------
function logSt(l) { return l.fr == null ? "—" : l.to == null ? `${stName(l.fr)} <span class="mut">(без изменения)</span>` : `${stName(l.fr)} → <b>${stName(l.to)}</b>`; }
function logView() {
  const L = S.lf;
  const iso = t => t.slice(6, 10) + "-" + t.slice(3, 5) + "-" + t.slice(0, 2);
  const rows = LOG.filter(l => (!L.a || l.a === L.a) && (!L.act || l.act === L.act) && (!L.from || iso(l.t) >= L.from) && (!L.to || iso(l.t) <= L.to)).sort((a, b) => pt(b.t) - pt(a.t));
  const admins = [...new Set(LOG.map(l => l.a))];
  return shell("log", `<div class="apanel"><h1>Журнал действий администраторов</h1>
    <div class="fbar"><select class="inp" id="la"><option value="">Администратор: все</option>${admins.map(a => `<option ${L.a === a ? "selected" : ""}>${a}</option>`).join("")}</select>
      <select class="inp" id="lact"><option value="">Действие: все</option>${ACTS.map(a => `<option ${L.act === a ? "selected" : ""}>${a}</option>`).join("")}</select>
      <span class="dr3">Дата: с <input type="date" class="inp" id="lfrom" value="${L.from}" max="2026-10-27"> по <input type="date" class="inp" id="lto" value="${L.to}" max="2026-10-27"></span>${L.a || L.act || L.from || L.to ? '<button class="btn link sm" id="lclr">Сбросить</button>' : ""}<span class="hint">Найдено: ${rows.length} · записи нельзя изменить или удалить</span></div>
    ${rows.length ? `<table class="t3"><thead><tr><th>Время</th><th>Администратор</th><th>Заказ</th><th>Действие</th><th>Статус: было → стало</th><th>Комментарий</th></tr></thead><tbody>
      ${rows.map(l => `<tr class="${l.nw ? "nw" : ""}"><td class="small">${l.t}${l.nw ? '<div class="mut">в этой сессии</div>' : ""}</td><td>${l.a} <span class="mut">(admin)</span></td><td>${ord(l.n) ? `<a href="#" data-open="${l.n}">№${l.n}</a>` : "№" + l.n}</td><td>${l.act}</td><td class="small">${logSt(l)}</td><td class="small">${l.c ? esc(l.c) : '<span class="mut">—</span>'}</td></tr>`).join("")}</tbody></table>`
      : '<div class="empty3">Нет действий по выбранным фильтрам.</div>'}</div>`);
}

// ---------- render and bind ----------
function render() {
  const v = S.v;
  $("#app").innerHTML = v === "order" ? orderView() : v === "prob" ? probView() : v === "log" ? logView() : listView();
  bind();
}
function bind() {
  const all = (sel, f) => document.querySelectorAll(sel).forEach(f);
  const on = (id, ev, f) => { const e = $("#" + id); if (e) e[ev] = f; };
  all("[data-nav]", x => x.onclick = () => { S.v = x.dataset.nav; S.stOpen = false; render(); });
  all("[data-open]", x => x.onclick = e => { e.preventDefault(); if (e.target.closest("[data-act]")) return; S.cur = x.dataset.open; S.v = "order"; render(); });
  all("[data-act]", x => x.onclick = e => { e.stopPropagation(); doAct(x.dataset.act, x.dataset.n); });
  all("[data-var]", x => x.onclick = () => { S.cur = x.dataset.var; render(); });
  all("[data-mg]", x => x.onclick = () => { S.merged = x.dataset.mg === "1"; render(); });
  all("[data-pt]", x => x.onclick = () => { const t = x.dataset.pt, a = S.pf.t; a.includes(t) ? a.splice(a.indexOf(t), 1) : a.push(t); S.focus = null; render(); });
  all("[data-st]", x => x.onchange = () => { const c = +x.dataset.st, a = S.f.st; x.checked ? a.push(c) : a.splice(a.indexOf(c), 1); render(); });
  on("stbtn", "onclick", () => { S.stOpen = !S.stOpen; render(); });
  on("stok", "onclick", () => { S.stOpen = false; render(); });
  on("stclr", "onclick", () => { S.f.st = []; render(); });
  on("fm", "onchange", e => { S.f.m = e.target.value; render(); });
  on("fb", "onchange", e => { S.f.br = e.target.value; render(); });
  on("fp", "onchange", e => { S.f.pr = e.target.checked; render(); });
  const clr = () => { S.f = { st: [], m: "", br: "", pr: false }; S.stOpen = false; render(); };
  on("fclr", "onclick", clr); on("fclr2", "onclick", clr);
  on("pm", "onchange", e => { S.pf.m = e.target.value; render(); });
  on("pclr", "onclick", () => { S.pf = { m: "", t: [] }; render(); });
  on("drf", "onchange", e => { S.demoRefuse = e.target.checked; });
  on("fgref", "onchange", e => { S.fgRefuse = e.target.checked; });
  on("la", "onchange", e => { S.lf.a = e.target.value; render(); });
  on("lact", "onchange", e => { S.lf.act = e.target.value; render(); });
  on("lfrom", "onchange", e => { S.lf.from = e.target.value; render(); });
  on("lto", "onchange", e => { S.lf.to = e.target.value; render(); });
  on("lclr", "onclick", () => { S.lf = { a: "", act: "", from: "", to: "" }; render(); });
  on("dnc", "onchange", e => { S.demoNoCancel = e.target.checked; });
  on("stale", "onchange", e => { S.stale = e.target.checked; });
  on("rep", "onclick", () => { const l = S.last; toast(`Повторный запрос «${l.act}» по заказу №${l.n}: ошибки нет, заказ не изменился, второй записи в истории и журнале нет.`); });
}

// ---------- dialogs ----------
// opts: { title, sub, label, req, reqErr, okText, okCls, noText, onOk(comment) -> string error to show, or nothing to close }
function dlg(op) {
  const m = modal(`<div class="o3m"><h3>${op.title}</h3>${op.sub ? `<p class="sub">${op.sub}</p>` : ""}${op.box ? `<div class="box3">${op.box}</div>` : ""}
    ${op.label ? `<label class="fl">${op.label}</label><textarea class="inp" id="dc" maxlength="500" rows="3"></textarea><div class="row" style="justify-content:space-between"><span class="err-t" id="de"></span><span class="cntr" id="dn">0 / 500</span></div>` : ""}
    <div id="dres"></div><div class="acts"><button class="btn out" id="dno">${op.noText || "Назад"}</button><button class="btn ${op.okCls || "pri"}" id="dok">${op.okText}</button></div></div>`);
  const ta = $("#dc", m);
  if (ta) { ta.focus(); ta.oninput = () => { $("#dn", m).textContent = ta.value.length + " / 500"; ta.classList.remove("err"); $("#de", m).textContent = ""; }; }
  $("#dno", m).onclick = closeModal;
  $("#dok", m).onclick = () => {
    const v = ta ? ta.value.trim() : "";
    if (op.req && !v) { ta.classList.add("err"); $("#de", m).textContent = op.reqErr; return; }
    if (S.stale && !op.noStale) { $("#dres", m).innerHTML = `<div class="alert e"><span class="ic">!</span><div>Статус заказа изменился. Обновите страницу.<div class="ra"><button class="btn out sm" id="drl">Обновить</button></div></div></div>`;
      $("#drl", m).onclick = () => { closeModal(); S.stale = false; render(); toast("Заказ загружен заново."); }; return; }
    const err = op.onOk(v);
    if (err) { $("#dres", m).innerHTML = `<div class="alert e"><span class="ic">!</span><div>${err}</div></div>`; return; }
    closeModal();
  };
}
function addLog(o, act, fr, to, c) { LOG.unshift({ t: ft(CLK), a: ME, n: o.n, act, fr, to, c, nw: true }); if (act !== "Написать продавцу") S.last = { n: o.n, act }; }
function staleDemo() {
  return `<label style="margin-left:8px"><input type="checkbox" id="stale" ${S.stale ? "checked" : ""}>другой администратор уже изменил заказ</label>${S.last ? `<button id="rep">повторить последний запрос</button>` : ""}`;
}
function setSt(o, to, src, c) { const t = nowS(); o.h.push([t, o.st, to, "a:" + ME, src, c]); const fr = o.st; o.st = to; o.closed = null; return [t, fr]; }
function corrDlg(o, to, actName, after, txt) {
  dlg({ title: txt ? txt[0] : `Изменить статус на «${stFull(to)}»?`, sub: txt ? txt[1] : "Используйте, только если служба доставки не обновила заказ.", box: `Заказ №${o.n} · ${MTH[o.m]} · сейчас ${stFull(o.st)}`,
    label: "Комментарий (обязательно)", req: true, reqErr: "Напишите, почему меняете статус.", okText: actName, okCls: "pri",
    onOk: c => { const [t, fr] = setSt(o, to, "K", c); addLog(o, actName, fr, to, c); after(c, t, fr); render(); } });
}
function doAct(k, n) {
  const o = ord(n);
  if (k === "cancel") return dlg({ title: `Отменить заказ №${o.n}?`, sub: "Покупатель увидит «Заказ отменён» и комментарий, если он есть; кто отменил, покупатель не видит. Остаток вернётся на склад филиала.",
    box: `${MTH[o.m]} · ${stFull(o.st)} → <b>46 CancelledByAdmin · Отменён Optom</b>`, label: "Комментарий (необязательно)", okText: "Отменить заказ", okCls: "danfill", noText: "Не отменять",
    onOk: c => {
      if (isCarrier(o) && S.fgRefuse && o.m === "fg") { o.ev.push([nowS(), "cancel_refused", null, o.fid]); return `Этот заказ уже нельзя отменить.<br>${carrierName(o)}: курьер уже забрал посылку.`; }
      const [t, fr] = setSt(o, 46, "A", c); o.cb = "Администратор"; o.cbw = ME; o.cr = "AdminCancelled"; o.cc = c; o.cat = t; o.prob = null;
      addLog(o, "Отменить заказ", fr, 46, c); render();
      toast(`Заказ №${o.n} отменён: 46 CancelledByAdmin.${isCarrier(o) && [20, 25, 24, 55, 60, 30].includes(fr) && o.fid ? " Бронь Fargo отменена." : ""} Покупатель и продавец получили уведомление.`);
    } });
  if (k === "resend") return dlg({ title: "Отправить заказ в Fargo заново?", sub: "Fargo рассчитает новую цену; покупатель не доплачивает.", label: "Комментарий (обязательно)", req: true, reqErr: "Напишите комментарий.", noText: "Назад",
    box: `${stFull(o.st)} → 25 Processing, если Fargo примет заказ<br>${[24, 60].includes(o.st) && o.fid ? `Сначала Fargo отменит прежнюю доставку <span class="mono">${o.fid}</span>, затем примет новую. Прежний FargoOrderId останется в истории и событиях.` : "Брони Fargo по заказу сейчас нет — отменять нечего."}`, okText: "Отправить заново",
    onOk: cm => {
      const prev = [24, 60].includes(o.st) && o.fid;
      if (prev && S.demoNoCancel) { o.ev.push([nowS(), "cancel_refused", null, o.fid]); render(); return "Fargo не отменил прежнюю доставку: курьер уже в пути. Новая доставка не заказана, заказ не изменился."; }
      if (prev) o.ev.push([nowS(), "cancelled", null, o.fid]);
      if (S.demoRefuse) {
        const [t, fr] = setSt(o, 55, "A", "Отправлено заново; Fargo отказал: delivery_rejected. " + cm); o.ev.push([t, "delivery_rejected", 55]); o.prob = { t: "notacc", since: t, det: "После «Отправить заново»: delivery_rejected" }; o.fid = null;
        addLog(o, "Отправить заново", fr, 55, "Fargo отказал: delivery_rejected. " + cm); S.focus = o.n;
        if (S.pf.t.length && !S.pf.t.includes("notacc")) S.pf.t.push("notacc"); // keep the row visible under the active type filter
        render(); toast("Fargo снова отказал: заказ в 55 FargoDoesNotAcceptOrder и остаётся в списке."); return;
      }
      const old = prev || null, nf = "FG-55" + String(13000 + Math.floor(Math.random() * 900)); o.fid = nf;
      const c = `Новый FargoOrderId ${nf}${old ? ` (был ${old})` : ""}`;
      const [t, fr] = setSt(o, 25, "A", `Отправлено заново. ${c}. ${cm}`); o.ev.push([t, "accepted", 25, nf]); o.prob = null; o.bst = null;
      addLog(o, "Отправить заново", fr, 25, `${c}. ${cm}`); render(); toast(`Fargo принял заказ: 25 Processing. ${c}. Строка убрана из списка.`);
    } });
  const stb = [24, 26, 55, 60].includes(o.st);
  if (k === "resolve") return dlg({ title: `Решено: заказ №${o.n}`, sub: o.prob.t === "part" ? "Статус заказа не изменится. Автозавершение возобновится."
      : stb ? `Строка закроется, статус останется ${stName(o.st)}: покупатель по-прежнему видит «Проблема с доставкой», продавец — во вкладке «Проблемные». Строка вернётся при новом событии проблемы или если статус не изменится за 24 часа.` : `Статус заказа не изменится (${stName(o.st)}). Строка уйдёт из списка.`,
    box: esc(probText(o)) + (o.prob.det ? `<div class="mut">${esc(o.prob.det)}</div>` : ""), label: "Комментарий (обязательно)", req: true, reqErr: "Напишите комментарий.", okText: "Решено", okCls: "pri",
    onOk: c => {
      const part = o.prob.t === "part", t = nowS(); addLog(o, "Решено", o.st, null, `${probText(o)}: ${c}`);
      if (stb) o.closed = { st: o.st, p: probText(o), at: t, by: ME, until: ft(pt(t) + 864e5) };
      o.prob = null; render();
      toast(part ? `Проблема закрыта. Автозавершение возобновлено: заказ завершится ${o.due.slice(0, 10)} в 23:59.` : stb ? "Строка закрыта; вернётся, если статус не изменится за 24 часа." : "Проблема закрыта, статус заказа не изменился.");
    } });
  if (k === "back") return corrDlg(o, 25, "Вернуть в обработку", () => { o.bst = "В пути"; toast("Статус изменён: 30 → 25 Processing. Покупатель по-прежнему видит «В пути»."); },
    ["Вернуть заказ в статус «В обработке»?", "Используйте, только если продавец отметил отправку по ошибке."]);
  if (k === "returned") return corrDlg(o, 50, "Посылка вернулась", (c, t) => { o.cb = "Система"; o.cr = "ReturnedToSender"; o.cc = c; o.cat = t; o.prob = null; toast("50 Refunded — финальный статус. Возврат денег покупателю — по правилам возвратов."); });
  if (k === "notdel") return corrDlg(o, 30, "Не доставлен", (c, t) => { o.prob = { t: "disp", since: t, det: `30 Shipped — установил ${ME} (администратор): ${c}` }; toast("Статус изменён: 35 → 30 Shipped. Автозавершение остановлено; заказ в «Проблемы с доставкой»: «Доставка оспорена»."); });
  if (k === "markdel") return corrDlg(o, 35, "Отметить доставленным", (c, t) => { o.prob = null; o.dlv = t; o.due = dueAfter(t); o.bst = null; toast(`35 Delivered. Покупатель получил уведомление о доставке; заказ завершится автоматически ${o.due.slice(0, 10)} в 23:59.`); });
  if (k === "retry") return dlg({ title: `Разрешить новую попытку доставки по заказу №${o.n}?`, sub: "Продавец снова сможет отправить заказ (24 OnHold → 30 Shipped). Статус сейчас не изменится.", label: "Комментарий (необязательно)", okText: "Разрешить",
    onOk: c => { nowS(); o.retryOk = true; addLog(o, "Разрешить новую попытку", o.st, null, c); render(); toast("Продавец может начать новую попытку доставки."); } });
  if (k === "msg") return dlg({ title: `Сообщение продавцу ${SEL[BRN[o.br][1]][0]}`, sub: `По заказу №${o.n}. Сообщение придёт в чат продавца.`, label: "Сообщение", req: true, reqErr: "Напишите сообщение.", okText: "Отправить", noStale: true,
    onOk: c => { nowS(); addLog(o, "Написать продавцу", null, null, c); render(); toast("Сообщение отправлено в чат продавца."); } });
}
